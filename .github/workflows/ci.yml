name: CI

on:
  push:
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
          cache: true
      - uses: actions/setup-go@v6 # the tunnel library, built by hook/build.dart
        with:
          go-version-file: native/wg/go.mod
          cache-dependency-path: native/wg/go.sum
      - run: flutter pub get
      - name: Translations generated from the .arb files
        run: flutter gen-l10n && git diff --exit-code lib/l10n
      - name: Formatted
        run: dart format -l 140 --set-exit-if-changed --output=none $(git ls-files '*.dart' | grep -v '^lib/l10n/')
      - run: flutter analyze
      - run: flutter test
      - name: Browser sessions, streaming chat and binary display frames
        env:
          CHROME_EXECUTABLE: /usr/bin/google-chrome
        run: |
          dart run tool/web_test_server.dart > "$RUNNER_TEMP/herapp-web-server.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid"' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail http://localhost:8766/health
          flutter test --platform chrome test/web_test.dart
      - run: flutter build web --release
      - uses: actions/upload-artifact@v5
        with:
          name: web
          path: build/web

  tunnel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/wg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: native/wg/go.mod
          cache-dependency-path: native/wg/go.sum
      - run: go vet ./... && go test ./...
