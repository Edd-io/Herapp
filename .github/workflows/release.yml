name: Release

# a v* tag builds the Android app, signed with the release key, into that tag's GitHub release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
          cache: true
      - uses: actions/setup-go@v6 # the tunnel library, built by hook/build.dart for each Android ABI
        with:
          go-version-file: native/wg/go.mod
          cache-dependency-path: native/wg/go.sum
      - name: Release key, from the repository's secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=herapp\nstoreFile=%s\n' "$PASSWORD" "$PASSWORD" "$RUNNER_TEMP/release.jks" > android/key.properties
      - run: flutter build apk --release
      - name: The APK, in the tag's release (a pre-release for a beta, rc or alpha)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          apk="herapp-$TAG.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$apk"
          pre=$([[ "$TAG" =~ (alpha|beta|rc) ]] && echo --prerelease || true)
          gh release create "$TAG" "$apk" --title "Herapp ${TAG#v}" --generate-notes $pre
